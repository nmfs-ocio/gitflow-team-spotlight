<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git Team Wall</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            orange: '#D97706',
                            teal: '#0D9488'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased">
    <header class="bg-white shadow-sm border-b-4 border-brand-orange">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <img src="assets/osprey-placeholder.png" alt="Osprey Mascot" class="h-16 w-16 object-cover rounded-full border-2 border-brand-teal">
                <h1 class="text-3xl font-bold text-gray-900">
                    <span class="text-brand-teal">Osprey</span> Team Wall
                </h1>
            </div>
            <p class="text-sm text-gray-500 hidden sm:block">A Git Collaboration Exercise</p>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <div id="team-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Profile cards will be dynamically injected here -->
        </div>
    </main>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
